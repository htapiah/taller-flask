{% extends "base.html" %}
{% block titulo %}Ejercicio 1{% endblock %}
{% block contenido %}
    <h1>Formulario de Notas</h1>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <label for="nota1">Nota 1:</label>
        <input type="number" step="any" id="nota1" name="nota1" min="10" max="70" required>
        <label for="nota2">Nota 2:</label>
        <input type="number" step="any" id="nota2" name="nota2" min="10" max="70" required>
        <label for="nota3">Nota 3:</label>
        <input type="number" step="any" id="nota3" name="nota3" min="10" max="70" required>
        <label for="asistencia">Asistencia (%):</label>
        <input type="number" step="any" id="asistencia" name="asistencia" min="0" max="100" required>
        <button type="submit">Enviar</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if promedio is defined %}
        <p class="resultado">Promedio: {{ promedio }}</p>
        <p class="resultado {{ 'ok' if estado == 'APROBADO' else 'mal' }}">{{ estado }}</p>
    {% endif %}
{% endblock %}
